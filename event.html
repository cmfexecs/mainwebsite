<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden bg-obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Chicano Music Festival</title>
    <link rel="icon" type="image/png" href="CMFcircle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#050505',
                        stoneDark: '#121212',
                        cmfTeal: '#4EBF96',
                        cmfGreen: '#92BF65',
                        cmfGold: '#D9BD32',
                        cmfOrange: '#D98723'
                    },
                    fontFamily: {
                        heading: ['Impact', 'sans-serif'], 
                        body: ['Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .teal-glow { box-shadow: 0 0 15px #4EBF96, 0 0 30px #4EBF96; }
        .text-glow-gold { text-shadow: 0 0 10px rgba(217, 189, 50, 0.8); }
        .text-shadow-heavy { text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        
        @keyframes slow-pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(78, 191, 150, 0.4), 0 0 20px rgba(217, 189, 50, 0.2); }
            50% { box-shadow: 0 0 25px rgba(78, 191, 150, 0.9), 0 0 45px rgba(217, 189, 50, 0.6); }
        }
        .animate-slow-pulse {
            animation: slow-pulse 4s ease-in-out infinite;
        }

        @keyframes neon-red-pulse {
            0%, 100% { text-shadow: 0 0 8px rgba(255, 0, 0, 0.8), 0 0 15px rgba(255, 0, 0, 0.4); color: #ffcccc; }
            50% { text-shadow: 0 0 15px rgba(255, 0, 0, 1), 0 0 30px rgba(255, 0, 0, 0.8); color: #ffffff; }
        }
        .nav-event-glow {
            animation: neon-red-pulse 2.5s ease-in-out infinite;
        }

        @keyframes strobe-gold {
            0%, 100% { color: #D9BD32; text-shadow: 0 0 10px rgba(217, 189, 50, 0.6), 0 0 20px rgba(217, 189, 50, 0.3); }
            50% { color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 1), 0 0 30px rgba(217, 189, 50, 0.8); }
        }
        .nav-updates-glow {
            animation: strobe-gold 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-white font-body overflow-x-hidden w-full max-w-[100vw] min-h-screen flex flex-col bg-obsidian relative">

    <audio id="bg-music" src="elchicano.mp3" loop></audio>

    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="background 2.jpeg" alt="CMF Atmospheric Background" class="w-full h-full object-cover opacity-40">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-obsidian"></div>
    </div>

    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">
        <button id="audio-toggle" class="bg-stoneDark/80 backdrop-blur-md border border-gray-600 text-gray-300 p-2 rounded-full shadow-lg hover:text-cmfTeal hover:border-cmfTeal transition focus:outline-none flex items-center justify-center w-10 h-10">
            <svg id="icon-playing" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v18c-4.97 0-9-4.03-9-9s4.03-9 9-9zm2 14h2V7h-2v10zm-4 0h2V7h-2v10z"/></svg>
            <svg id="icon-muted" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L7.91 7.09H4v9.82h3.91L12 21V3zm2.5 5.5v7l4-3.5-4-3.5z"/></svg>
        </button>
        <a href="https://events.ticketleap.com/events/chicanomusicfest" target="_blank" class="bg-cmfGold text-obsidian font-heading tracking-widest uppercase px-6 py-3 shadow-[0_0_15px_rgba(217,189,50,0.5)] hover:bg-white hover:scale-105 transition-all duration-300 flex items-center gap-2 border border-cmfGold">
            TIX
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
    </div>

    <div class="relative z-10 flex-grow flex flex-col w-full">

        <nav class="w-full absolute top-0 z-50 bg-transparent py-4 px-4 md:px-8 flex justify-between items-center pointer-events-none">
            <a href="index.html" class="relative z-50 pointer-events-auto">
                <img src="CMF stonelogo.jpeg" alt="CMF Logo" class="h-12 md:h-20 w-auto object-contain hover:scale-105 transition duration-300 rounded-md animate-slow-pulse">
            </a>
            
            <div class="hidden md:flex gap-8 font-heading tracking-widest uppercase text-base text-gray-100 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] pointer-events-auto">
                <a href="about.html" class="hover:text-cmfTeal transition">About</a>
                <a href="event.html" class="nav-event-glow transition">Events</a>
                <a href="https://www.youtube.com/@ChicanoMusicFesitval" target="_blank" class="hover:text-cmfTeal transition">Digital</a>
                <a href="https://blog.chicanomusicfestival.com" target="_blank" class="nav-updates-glow transition">Updates</a>
                <a href="contact.html" class="text-cmfGold transition">Contact</a>
            </div>

            <button id="mobile-menu-btn" class="md:hidden text-white z-50 relative p-2 focus:outline-none pointer-events-auto">
                <svg class="w-8 h-8 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </nav>

        <div id="mobile-menu" class="fixed inset-0 bg-obsidian/95 backdrop-blur-md z-40 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
            <div class="flex flex-col gap-10 font-heading tracking-widest uppercase text-3xl text-center text-white">
                <a href="about.html" class="hover:text-cmfTeal transition">About</a>
                <a href="event.html" class="nav-event-glow transition">Events</a>
                <a href="https://www.youtube.com/@ChicanoMusicFesitval" target="_blank" class="hover:text-cmfTeal transition">Digital</a>
                <a href="https://blog.chicanomusicfestival.com" target="_blank" class="nav-updates-glow transition">Updates</a>
                <a href="contact.html" class="text-cmfGold">Contact</a>
            </div>
        </div>

        <main class="flex-grow flex flex-col items-center justify-center pt-32 md:pt-40 pb-20 px-4 lg:px-20 w-full overflow-hidden">
            
            <div class="max-w-4xl mx-auto w-full text-center">
                <div class="bg-stoneDark/70 backdrop-blur-lg border-2 border-cmfGold p-8 md:p-16 shadow-[0_0_30px_rgba(217,189,50,0.3)] hover:shadow-[0_0_50px_rgba(217,189,50,0.5)] transition duration-500">
                    <h2 class="text-4xl md:text-6xl font-heading tracking-widest uppercase text-white mb-6 text-shadow-heavy leading-tight">
                        Check Back <span class="text-cmfTeal">Soon</span>
                    </h2>
                    <div class="w-32 h-1 bg-cmfGold mx-auto mb-8"></div>
                    <p class="text-gray-300 font-heading tracking-widest uppercase text-xl md:text-3xl text-shadow-heavy leading-relaxed">
                        For the latest events presented by the CMF Team!
                    </p>
                </div>
            </div>

        </main>

        <footer class="w-full bg-obsidian/90 backdrop-blur-md border-t border-gray-800 py-8 mt-auto z-20 relative">
            <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-6">
                <div class="flex gap-4 md:gap-8">
                    <a href="https://www.instagram.com/chicanomusicfest" target="_blank" class="px-6 py-2 border border-cmfTeal text-cmfTeal font-heading tracking-widest uppercase text-xs hover:bg-cmfTeal hover:text-obsidian transition duration-300 shadow-[0_0_10px_rgba(78,191,150,0.2)]">
                        Instagram
                    </a>
                </div>
                <div class="text-gray-400 font-heading tracking-widest uppercase text-xs md:text-sm text-center">
                    &copy; 2026 Chicano Music Festival
                </div>
            </div>
        </footer>
    </div>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        let isMenuOpen = false;

        btn.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            if(isMenuOpen) {
                menu.classList.remove('hidden');
                setTimeout(() => { menu.classList.remove('opacity-0'); menu.classList.add('opacity-100'); }, 10);
                btn.innerHTML = `<svg class="w-8 h-8 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                menu.classList.remove('opacity-100');
                menu.classList.add('opacity-0');
                setTimeout(() => { menu.classList.add('hidden'); }, 300);
                btn.innerHTML = `<svg class="w-8 h-8 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>`;
            }
        });

        const bgMusic = document.getElementById('bg-music');
        const audioBtn = document.getElementById('audio-toggle');
        const iconPlaying = document.getElementById('icon-playing');
        const iconMuted = document.getElementById('icon-muted');

        setTimeout(() => {
            if (!bgMusic.paused) {
                iconMuted.classList.add('hidden');
                iconPlaying.classList.remove('hidden');
            }
        }, 500);

        audioBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                iconMuted.classList.add('hidden');
                iconPlaying.classList.remove('hidden');
            } else {
                bgMusic.pause();
                iconPlaying.classList.add('hidden');
                iconMuted.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
